# =============================================================================
# XEQMLabs Seed Node Configuration
# Role    : Seed node (peer discovery only, no public RPC)
# Binary  : xeq-d via ghcr.io/equilibriahorizon/equilibria-node:v23.0.0
# =============================================================================

# --- Core ---
data-dir=/data
log-file=/data/xeqm.log
log-level=debug
max-log-file-size=104850000
max-log-files=10
max-concurrency=3

# --- Sync ---
fast-block-sync=1
block-sync-size=0
db-sync-mode=fast:async:250000000bytes

# --- P2P ---
p2p-bind-ip=0.0.0.0
p2p-bind-port=9230
p2p-use-ipv6=1
p2p-bind-ipv6-address=::
p2p-bind-port-ipv6=9230
out-peers=64
in-peers=128
limit-rate-up=4096
limit-rate-down=16384

# --- Seed peers (all 5 seeds as priority nodes) ---
add-exclusive-node=seed-1.xeqmlabs.com:9230
add-exclusive-node=seed-2.xeqmlabs.com:9230
add-exclusive-node=seed-3.xeqmlabs.com:9230
add-exclusive-node=seed-4.xeqmlabs.com:9230
add-exclusive-node=seed-5.xeqmlabs.com:9230

# --- RPC (admin localhost only, no public RPC on seed nodes) ---
rpc-admin=0.0.0.0:9231

# --- Transaction pool ---
max-txpool-weight=648000000
pad-transactions=1

# ---OMQ Listener---
lmq-public=tcp://0.0.0.0:9233
start-mining=XEQM9WDMP7ZWvuY5AQPpQdWsufYyB1vmYEHWVQV4wUrU3uyr4xHg2nA34KdGtyng6B39RZrr6t8DuhS1gadkARM43cCij1tkDW
mining-threads=4
