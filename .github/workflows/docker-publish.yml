name: Build and Publish Docker Image

on:
  # Final release tags publish :vX.Y.Z and :latest. A manual run publishes :edge only, so an
  # in-progress main never becomes the public :latest image. rc tags do not match.
  push:
    tags:
      - "core-v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: xeqmlabs/xeqm-node

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Choose image tags
        id: tags
        run: |
          VERSION=$(grep -m1 -oP '^\s*VERSION \K[0-9]+\.[0-9]+\.[0-9]+' CMakeLists.txt)
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            if [ "${GITHUB_REF_NAME}" != "core-v${VERSION}" ]; then
              echo "Tag ${GITHUB_REF_NAME} does not match CMake VERSION ${VERSION}" >&2
              exit 1
            fi
            if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
              echo "tags=${IMAGE}:v${VERSION},${IMAGE}:latest" >> "$GITHUB_OUTPUT"
            else
              echo "tags=${IMAGE}:v${VERSION}" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "tags=${IMAGE}:edge" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
