name: Build XEQM Core Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version label, for example 23.0.0-dev"
        required: true
        type: string

  push:
    tags:
      - "core-v*"

permissions:
  contents: write

jobs:
  linux-ubuntu-2404:
    name: Build Ubuntu 24.04 x64 binaries
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout core repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            git build-essential cmake pkg-config ccache curl zip unzip tar \
            libssl-dev libzmq3-dev libsodium-dev libunbound-dev \
            libreadline-dev libhidapi-dev libusb-1.0-0-dev libexpat1-dev \
            libpgm-dev libsqlite3-dev libcurl4-openssl-dev \
            libboost-all-dev libzstd-dev libgmp-dev

      - name: Configure
        run: |
          rm -rf build
          mkdir -p build
          cd build
          cmake .. \
            -DCMAKE_BUILD_TYPE=Release \
            -DBoost_NO_BOOST_CMAKE=ON

      - name: Build
        run: |
          cd build
          make -j"$(nproc)"

      - name: Verify binaries
        run: |
          build/bin/xeqm-d --version
          build/bin/xeqm-wallet --version
          build/bin/xeqm-rpc --version
          file build/bin/xeqm-d
          file build/bin/xeqm-wallet
          file build/bin/xeqm-rpc

      - name: Package Ubuntu binaries
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#core-v}"
          fi

          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          PKG="XEQM-core-${VERSION}-ubuntu-24.04-x86_64-${SHORT}"

          mkdir -p "$PKG"
          cp build/bin/xeqm-d "$PKG/"
          cp build/bin/xeqm-wallet "$PKG/"
          cp build/bin/xeqm-rpc "$PKG/"
          chmod +x "$PKG"/*

          {
            printf "XEQM Core Ubuntu 24.04 x86_64 binaries\\n\\n"
            printf "Source commit: %s\\n\\n" "$COMMIT"
            printf "Included:\\n"
            printf "  xeqm-d\\n"
            printf "  xeqm-wallet\\n"
            printf "  xeqm-rpc\\n\\n"
            printf "Version output:\\n\\n"
            ./build/bin/xeqm-d --version
            ./build/bin/xeqm-wallet --version
            ./build/bin/xeqm-rpc --version
          } > "$PKG/README.txt"

          tar -czf "${PKG}.tar.gz" "$PKG"
          sha256sum "${PKG}.tar.gz" > "${PKG}.tar.gz.sha256"

      - name: Upload Ubuntu artifact
        uses: actions/upload-artifact@v4
        with:
          name: XEQM-core-ubuntu-24.04-x86_64
          path: |
            XEQM-core-*-ubuntu-24.04-x86_64-*.tar.gz
            XEQM-core-*-ubuntu-24.04-x86_64-*.tar.gz.sha256

  windows-x64:
    name: Build Windows x64 binaries
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout core repo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            autoconf
            automake
            libtool
            m4
            patch
            perl
            mingw-w64-x86_64-toolchain
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-pkgconf
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-openssl
            mingw-w64-x86_64-zeromq
            mingw-w64-x86_64-libsodium
            mingw-w64-x86_64-sqlite3
            mingw-w64-x86_64-curl
            mingw-w64-x86_64-hidapi
            mingw-w64-x86_64-libusb
            mingw-w64-x86_64-zstd
            mingw-w64-x86_64-gmp
            mingw-w64-x86_64-unbound
            zip

      - name: Show build environment
        run: |
          uname -a
          pwd
          pwd -W
          which cmake
          cmake --version
          which make
          make --version | head -5
          gcc --version | head -3

      - name: Build Windows x64
        run: |
          make release-static-win64 -j"$(nproc)"

      - name: Locate Windows binaries
        id: locate
        shell: msys2 {0}
        run: |
          echo "Searching for Windows binaries..."
          find . -type f \( \
            -name 'xeqm-d.exe' -o \
            -name 'xeqm-wallet.exe' -o \
            -name 'xeqm-rpc.exe' -o \
            -name '*.dll' \
          \) | sort

          BIN_DIR="$(find . -type f -name 'xeqm-d.exe' -exec dirname {} \; | head -1)"

          if [ -z "$BIN_DIR" ]; then
            echo "FATAL: Could not find xeqm-d.exe"
            find . -type f -name '*.exe' | sort
            exit 1
          fi

          echo "bin_dir=$BIN_DIR" >> "$GITHUB_OUTPUT"
          echo "Found Windows bin dir: $BIN_DIR"

      - name: Verify Windows binaries exist
        shell: msys2 {0}
        run: |
          BIN_DIR="${{ steps.locate.outputs.bin_dir }}"
          test -f "$BIN_DIR/xeqm-d.exe"
          test -f "$BIN_DIR/xeqm-wallet.exe"
          test -f "$BIN_DIR/xeqm-rpc.exe"

          file "$BIN_DIR/xeqm-d.exe"
          file "$BIN_DIR/xeqm-wallet.exe"
          file "$BIN_DIR/xeqm-rpc.exe"

      - name: Package Windows binaries
        shell: msys2 {0}
        run: |
          VERSION="${{ inputs.version }}"
          if [ -z "$VERSION" ]; then
            VERSION="${GITHUB_REF_NAME#core-v}"
          fi

          COMMIT="$(git rev-parse HEAD)"
          SHORT="$(git rev-parse --short HEAD)"
          BIN_DIR="${{ steps.locate.outputs.bin_dir }}"
          PKG="XEQM-core-${VERSION}-windows-x86_64-${SHORT}"

          mkdir -p "$PKG"

          cp "$BIN_DIR/xeqm-d.exe" "$PKG/"
          cp "$BIN_DIR/xeqm-wallet.exe" "$PKG/"
          cp "$BIN_DIR/xeqm-rpc.exe" "$PKG/"

          find "$BIN_DIR" -maxdepth 1 -type f -name '*.dll' -exec cp {} "$PKG/" \; || true

          {
            printf "XEQM Core Windows x86_64 binaries\n\n"
            printf "Source commit: %s\n\n" "$COMMIT"
            printf "Included:\n"
            printf "  xeqm-d.exe\n"
            printf "  xeqm-wallet.exe\n"
            printf "  xeqm-rpc.exe\n\n"
            printf "Version output:\n\n"
            wine "$BIN_DIR/xeqm-d.exe" --version || true
            wine "$BIN_DIR/xeqm-wallet.exe" --version || true
            wine "$BIN_DIR/xeqm-rpc.exe" --version || true
          } > "$PKG/README.txt"

          zip -r "${PKG}.zip" "$PKG"
          sha256sum "${PKG}.zip" > "${PKG}.zip.sha256"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: XEQM-core-windows-x86_64
          path: |
            XEQM-core-*-windows-x86_64-*.zip
            XEQM-core-*-windows-x86_64-*.zip.sha256

  publish:
    name: Publish core release
    needs:
      - linux-ubuntu-2404
      - windows-x64
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/core-v')

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: List assets
        run: |
          find release-assets -type f -print

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: XEQM Core ${{ github.ref_name }}
          files: release-assets/**/*
          draft: false
          prerelease: false
          generate_release_notes: false
          body: |
            XEQM Core binary release.

            Includes:
            - Ubuntu 24.04 x86_64 tar.gz
            - Windows x86_64 zip

            Source commit:
            ${{ github.sha }}
